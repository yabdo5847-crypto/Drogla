[build]
  publish = "."

# ── 301 Redirects: Strip .html extensions from browser URLs ──
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/control"
  status = 301
  force = true

[[redirects]]
  from = "/shop.html"
  to = "/shop"
  status = 301
  force = true

[[redirects]]
  from = "/product.html"
  to = "/product"
  status = 301
  force = true

[[redirects]]
  from = "/cart.html"
  to = "/cart"
  status = 301
  force = true

[[redirects]]
  from = "/checkout.html"
  to = "/checkout"
  status = 301
  force = true

# ── 200 Rewrites: Serve underlying HTML files for clean URLs ──
[[redirects]]
  from = "/control"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/product/:id"
  to = "/product.html?id=:id"
  status = 200

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

# ── Block sensitive files ──
[[redirects]]
  from = "/.git/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

# ── Fallback Catch-All ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Global HTTP Security Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdn.emailjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: https://placehold.co https://*.supabase.co; media-src 'self' data: blob: https: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.emailjs.com https://script.google.com https://script.googleusercontent.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://script.google.com;"
